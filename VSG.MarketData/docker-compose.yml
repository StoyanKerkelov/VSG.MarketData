services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vsg-marketdata-api:latest
    container_name: vsg-marketdata-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MarketData: "Data Source=/app/data/marketdata.db"
    volumes:
      - marketdata:/app/data
    restart: unless-stopped

volumes:
  marketdata:
